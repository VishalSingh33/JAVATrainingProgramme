management.endpoints.web.exposure.include: '*'
server:
  port: 8080
logging:
  file:
    # path: /home/ltb/web/logs
spring:
  application.name: british
#   cloud.config.uri: http://localhost:7010
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
      enabled: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  datasource:
    url: jdbc:mysql://localhost:3306/airplane
    hikari.schema: localschema
    username: root
    password:
    driverClassName: com.mysql.cj.jdbc.Driver 
    # org.postgresql.Driver  jdbc:postgresql://192.168.7.41:5432/postgres
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect # Update to MySQL 8 dialect
    show-sql: true
    hibernate:
      ddl-auto: update
